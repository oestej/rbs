# Publishes a release from a pushed vX.Y.Z tag.
#
# If Unreleased still holds the notes, this workflow rolls them into a dated
# heading, bumps the application version when needed, commits that onto main,
# and moves the tag onto the new commit before building. A locally prepared
# changelog is left alone. See docs/releases.md.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Required to create the GitHub Release and upload the disk image to it.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Matches the interpreter the desktop build is verified against.
  PYTHON_VERSION: "3.14"

jobs:
  macos:
    name: Build and publish RBS Desktop for macOS
    # RBS Desktop ships for Apple Silicon only, which is what a GitHub-hosted
    # macOS runner is. No Intel artifact is built.
    runs-on: macos-latest
    # Holds the Apple signing credentials. Scoping them to an environment keeps
    # them out of reach of workflows on other branches, and lets a deployment
    # rule restrict them to v* tags.
    environment: release
    # Covers the build plus two notarization round trips, each of which waits on
    # Apple and is capped at 30 minutes by tools/notarize_desktop.sh.
    timeout-minutes: 150
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # merge-base below needs history, not just the tagged commit.
          fetch-depth: 0
          # This job installs and freezes third-party packages, which runs their
          # code. Discarding the token keeps it out of .git/config while that
          # happens. The fetch below stays anonymous, which a public repository
          # allows; making this repository private would require restoring it.
          persist-credentials: false

      - name: Require the tag to name a commit on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "::error::${GITHUB_REF_NAME} does not point at a commit contained in main."
            exit 1
          fi

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      # Runs before the dependency install so a mistagged or empty Unreleased
      # section fails in seconds rather than after a full build. This run then
      # publishes from the prepared tree; moving the tag keeps git history
      # aligned with the artifact.
      - name: Prepare the changelog for this tag if it is still Unreleased
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          release_date="$(date -u +%Y-%m-%d)"
          uv run --no-project --python "${PYTHON_VERSION}" \
            python tools/release_changelog.py "${version}" \
            --date "${release_date}" --if-needed
          if git diff --quiet -- CHANGELOG.md src/rbs/__init__.py; then
            echo "Changelog already prepared for ${GITHUB_REF_NAME}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md src/rbs/__init__.py
          git commit -m "Prepare ${version} release"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "${remote}" "HEAD:refs/heads/main"
          git tag -fa "${GITHUB_REF_NAME}" -m "RBS ${version}"
          git push --force "${remote}" "refs/tags/${GITHUB_REF_NAME}"

      - name: Verify the tag, application version, and changelog agree
        run: |
          uv run --no-project --python "${PYTHON_VERSION}" \
            python tools/release_notes.py "${GITHUB_REF_NAME}" \
            --output "${RUNNER_TEMP}/release-notes.md"

      - name: Verify the lockfile matches pyproject.toml
        run: uv lock --check

      - name: Ruff
        run: uv run --frozen --extra dev ruff check .

      # Hosted runners cannot spare the CPU a `solve` test's wall-clock budget
      # assumes; see tests/solver/conftest.py. Same extra as ci.yml so native
      # Help-menu tests have pywebview.
      - name: Pytest
        run: uv run --frozen --extra dev --extra desktop pytest -m "not solve"

      # build_desktop.sh runs its own exact `uv sync --extra desktop --extra
      # build`, which removes the development packages installed above. The
      # bundle audit it runs afterwards therefore sees only declared desktop
      # dependencies, exactly as it does on a developer's machine.
      - name: Build RBS Desktop
        run: tools/build_desktop.sh

      # Signing is skipped, rather than failed, when the repository has no Apple
      # credentials. That keeps a release publishable before the secrets are in
      # place; the steps below turn themselves on the moment they are. See
      # docs/releases.md for what each secret holds.
      - name: Check for Apple signing credentials
        id: signing
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [[ -n "${CERTIFICATE_P12}" && -n "${API_KEY_P8}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Apple signing credentials are not configured; publishing an unsigned build."
          fi

      - name: Import the Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # The runner is destroyed with the job, but a dedicated keychain still
          # keeps the certificate out of the login keychain and gives codesign
          # one that is already unlocked.
          keychain="${RUNNER_TEMP}/signing.keychain-db"
          keychain_password="$(uuidgen)"
          certificate="${RUNNER_TEMP}/certificate.p12"

          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"

          printf '%s' "${CERTIFICATE_P12}" | base64 --decode > "${certificate}"
          security import "${certificate}" \
            -k "${keychain}" \
            -P "${CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign
          rm -f "${certificate}"

          # Without a partition list, codesign blocks on a UI prompt no one can
          # answer. Adding the keychain to the search list lets `security
          # find-identity` see the certificate too.
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain}" >/dev/null
          security list-keychains -d user -s "${keychain}" \
            $(security list-keychains -d user | tr -d '"')

          echo "SIGNING_KEYCHAIN=${keychain}" >> "${GITHUB_ENV}"

      - name: Write the App Store Connect API key
        if: steps.signing.outputs.enabled == 'true'
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key="${RUNNER_TEMP}/notary-key.p8"
          printf '%s' "${API_KEY_P8}" | base64 --decode > "${key}"
          chmod 600 "${key}"
          echo "APPLE_API_KEY_PATH=${key}" >> "${GITHUB_ENV}"

      - name: Sign RBS Desktop
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: tools/sign_desktop.sh

      # Notarizing the application as well as the image below is what lets a
      # stapled copy pass Gatekeeper on a machine that is offline the first time
      # it opens RBS Desktop.
      - name: Notarize RBS Desktop
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: tools/notarize_desktop.sh --path "dist/RBS Desktop.app"

      # Signs the image when APPLE_DEVELOPER_ID is set and leaves it unsigned
      # otherwise, which is why this step needs no condition of its own.
      - name: Package the disk image
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: tools/package_dmg.sh

      - name: Notarize the disk image
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          images=(dist/*.dmg)
          if (("${#images[@]}" != 1)); then
            echo "::error::Expected exactly one disk image in dist, found ${#images[@]}."
            exit 1
          fi
          tools/notarize_desktop.sh --path "${images[0]}"

      # Keeps the artifact reachable even if publishing fails, so a release can
      # be retried without rebuilding.
      - name: Upload the disk image as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rbs-desktop-macos-${{ github.ref_name }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Compose the release description
        env:
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          cp "${RUNNER_TEMP}/release-notes.md" "${RUNNER_TEMP}/release-body.md"
          printf '%s\n' \
            '' \
            '### Installing on macOS' \
            '' \
            'Open the disk image and drag **RBS Desktop** to **Applications**.' \
            >> "${RUNNER_TEMP}/release-body.md"
          if [[ "${SIGNED}" != "true" ]]; then
            printf '%s\n' \
              'This build is not signed with an Apple Developer ID, so macOS' \
              'quarantines it after download: right-click the installed app and' \
              'choose **Open** once to confirm it should run.' \
              >> "${RUNNER_TEMP}/release-body.md"
          fi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "RBS ${GITHUB_REF_NAME#v}" \
            --notes-file "${RUNNER_TEMP}/release-body.md" \
            --verify-tag \
            dist/*.dmg
